# Publishes a GitHub release for every pushed tag, with build-provenance
# attestations for the three files Obsidian installs. There is no build step:
# the attested files are exactly the ones committed at that tag.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that manifest.json matches the tag
        run: |
          version=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          test "$version" = "${GITHUB_REF_NAME}" || { echo "manifest.json says $version, tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css --title "${GITHUB_REF_NAME}" --notes "See the commit history for changes. Release files carry GitHub build-provenance attestations."
